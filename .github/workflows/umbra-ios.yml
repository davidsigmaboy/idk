name: Umbra iOS (IPA)

# Takes upstream Ghostgram at a pinned commit, applies patches/umbra-ios.patch (rename to Umbra + new
# features) and builds an IPA. It is signed with Telegram's fake profile, so re-sign it with your own
# Apple ID (Sideloadly / AltStore) before installing.
# Secrets (in the Random environment): API_ID, API_HASH (https://my.telegram.org). The build stops at once if they are missing.

on:
  workflow_dispatch:   # manual only: a macOS minute counts as 10 minutes of the free quota

env:
  GHOSTGRAM_SHA: df95ba566c5f25a8f36de2b703bf070ca97c54ba

jobs:
  ipa:
    environment: "Random environment"
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Check Telegram API secrets
        env:
          TG_API_ID: ${{ secrets.API_ID || secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.API_HASH || secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Add secrets API_ID and API_HASH to the environment (Settings > Secrets and variables > Actions). Get them at https://my.telegram.org"
            exit 1
          fi


      - name: Fetch Ghostgram and apply the Umbra patch
        run: |
          mkdir ghostgram && cd ghostgram
          git init -q
          git remote add origin https://github.com/ichmagmaus111/ghostgram.git
          git fetch --depth 1 origin "$GHOSTGRAM_SHA"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          git apply --whitespace=nowarn ../patches/umbra-ios.patch
          git apply --whitespace=nowarn ../patches/umbra-plugins.patch
          # The fake provisioning profiles shipped with Ghostgram expired on 2026-10-30; the IPA is
          # re-signed with your own Apple ID anyway, so the expiry check is switched off.
          python3 - <<'PY'
          p = "build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py"
          s = open(p).read()
          old = "if expire and expire < datetime.datetime.now():"
          assert old in s, "expiry check not found"
          open(p, "w").write(s.replace(old, "if False:"))
          print("expiry check disabled")
          PY
          cp -R ../umbra-android ./umbra-android

      - name: Umbra icons and visible name
        working-directory: ghostgram
        run: |
          unzip -oq ../branding/icons.zip -d .
          python3 ../scripts/rebrand_text.py .

      - name: Select Xcode
        working-directory: ghostgram
        run: |
          XCODE=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app/Contents/Developer"

      - name: Write configuration
        working-directory: ghostgram
        env:
          TG_API_ID: ${{ secrets.API_ID || secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.API_HASH || secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("build-system/ghostgram-configuration.example.json"))
          cfg.update({"bundle_id": "ph.telegra.Telegraph", "team_id": "C67CF9S4VU",
                      "api_id": os.environ["TG_API_ID"], "api_hash": os.environ["TG_API_HASH"]})
          json.dump(cfg, open("build-system/ghostgram-configuration.json", "w"), indent=2)
          PY

      - name: Build IPA
        working-directory: ghostgram
        run: |
          mkdir -p build-output/ipa
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          build-system/GGXcodeConfig.sh
          GG_PATCHES_ONLY=1 build-system/GGBuild.sh
          python3 -u build-system/Make/Make.py --overrideXcodeVersion \
            build \
            --configurationPath build-system/ghostgram-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --buildNumber "${GITHUB_RUN_NUMBER}" --configuration debug_arm64 \
            --outputBuildArtifactsPath build-output/ipa
          mv build-output/ipa/Telegram.ipa build-output/ipa/Umbra.ipa

      - name: Add Python and the plugin layer to the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/py"; mkdir -p "$WORK"; cd "$WORK"
          TAG=$(gh release list --repo beeware/Python-Apple-support --limit 100 --json tagName -q '.[].tagName' | grep '^3\.13-' | head -1)
          echo "Python-Apple-support release: $TAG"
          gh release download "$TAG" --repo beeware/Python-Apple-support --pattern 'Python-3.13-iOS-support*.tar.gz'
          tar xzf Python-3.13-iOS-support*.tar.gz
          SLICE="$WORK/Python.xcframework/ios-arm64"
          test -d "$SLICE/Python.framework" || { echo "::error::Python.framework not found in $TAG"; ls -R "$WORK/Python.xcframework" | head -40; exit 1; }
          test -d "$SLICE/lib/python3.13" || { echo "::error::python3.13 stdlib not found in $TAG"; exit 1; }

          IPA="$GITHUB_WORKSPACE/ghostgram/build-output/ipa/Umbra.ipa"
          rm -rf "$WORK/ipa"; mkdir "$WORK/ipa"; cd "$WORK/ipa"
          unzip -q "$IPA"
          APP=$(ls -d Payload/*.app | head -1)
          mkdir -p "$APP/Frameworks" "$APP/python/lib" "$APP/python/umbra"
          cp -R "$SLICE/Python.framework" "$APP/Frameworks/"
          cp -R "$SLICE/lib/python3.13" "$APP/python/lib/"
          rm -rf "$APP/python/lib/python3.13"/{test,idlelib,tkinter,turtledemo,ensurepip,lib2to3,__pycache__}
          cp "$GITHUB_WORKSPACE"/plugins-shim/*.py "$APP/python/umbra/"
          cp -R "$GITHUB_WORKSPACE/plugins-shim/ui" "$APP/python/umbra/ui"
          rm -f "$APP"/python/umbra/test_*.py

          # iOS wants every native Python module as its own framework; Python finds it through a .fwork file.
          python3 - "$APP" <<'PY'
          import glob, os, plistlib, shutil, subprocess, sys
          app = sys.argv[1]
          count = 0
          for path in sorted(glob.glob(f"{app}/python/lib/python3.13/lib-dynload/*")):
              name = os.path.basename(path)
              if not name.endswith((".so", ".dylib")):
                  continue
              module = name.split(".cpython")[0].split(".")[0]
              fw = f"{app}/Frameworks/{module}.framework"
              os.makedirs(fw, exist_ok=True)
              shutil.move(path, f"{fw}/{module}")
              subprocess.check_call(["install_name_tool", "-id", f"@rpath/{module}.framework/{module}", f"{fw}/{module}"])
              with open(f"{fw}/Info.plist", "wb") as f:
                  plistlib.dump({"CFBundleExecutable": module, "CFBundleIdentifier": "org.python." + module.replace("_", "-"),
                                 "CFBundleName": module, "CFBundlePackageType": "FMWK", "CFBundleVersion": "1",
                                 "CFBundleShortVersionString": "1", "MinimumOSVersion": "13.0",
                                 "CFBundleSupportedPlatforms": ["iPhoneOS"]}, f)
              fwork = os.path.splitext(path)[0] + ".fwork"
              with open(fwork, "w") as f:
                  f.write(f"Frameworks/{module}.framework/{module}")
              with open(f"{fw}/{module}.origin", "w") as f:
                  f.write(os.path.relpath(fwork, app))
              count += 1
          print("native Python modules moved into frameworks:", count)
          PY

          # Plugins are dropped into the app's Documents folder through the Files app.
          plutil -replace UIFileSharingEnabled -bool true "$APP/Info.plist"
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool true "$APP/Info.plist"

          rm -f "$IPA"
          zip -qry "$IPA" .
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: Umbra-ipa
          path: ghostgram/build-output/ipa/Umbra.ipa
