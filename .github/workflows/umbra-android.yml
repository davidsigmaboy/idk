name: Umbra Android (APK)

on:
  workflow_dispatch:   # manual only

permissions:
  contents: write      # publishes the APK as a GitHub release (the in-app updater reads it)

jobs:
  apk:
    environment: "Random environment"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check Telegram API secrets
        env:
          TG_API_ID: ${{ secrets.API_ID || secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.API_HASH || secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Add secrets API_ID and API_HASH to the environment (Settings > Secrets and variables > Actions). Get them at https://my.telegram.org"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Tools for TDLib
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build php-cli gperf perl make
      - name: Cache TDLib build
        id: tdcache
        uses: actions/cache@v4
        with:
          path: umbra-android/app/src/tdlib
          key: tdlib-${{ hashFiles('umbra-android/scripts/build-tdlib.sh') }}
      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: ./umbra-android/scripts/build-tdlib.sh
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Signing key
        env:
          TG_API_HASH: ${{ secrets.API_HASH || secrets.TG_API_HASH }}
        run: |
          # The committed key file is encrypted with your API hash (a secret), so it is useless to anybody else.
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TG_API_HASH -in umbra-android/umbra.jks.enc -out "$RUNNER_TEMP/umbra.jks"
          echo "UMBRA_KEYSTORE=$RUNNER_TEMP/umbra.jks" >> "$GITHUB_ENV"
          echo "UMBRA_BUILD=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Plugin runtime sources
        run: |
          mkdir -p umbra-android/app/src/main/python
          cp plugins-shim/*.py umbra-android/app/src/main/python/
          cp -r plugins-shim/ui umbra-android/app/src/main/python/ui
          find umbra-android/app/src/main/python -name __pycache__ -prune -exec rm -rf {} +
      - name: Build APK (with plugins)
        id: with_plugins
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.API_ID || secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.API_HASH || secrets.TG_API_HASH }}
          UMBRA_PLUGINS: "1"
        run: gradle -p umbra-android --no-daemon :app:assembleDebug
      - name: Build APK (without plugins, fallback)
        if: steps.with_plugins.outcome != 'success'
        env:
          TG_API_ID: ${{ secrets.API_ID || secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.API_HASH || secrets.TG_API_HASH }}
          UMBRA_PLUGINS: "0"
        run: |
          echo "::warning::Chaquopy build failed, the APK has no plugin support"
          rm -rf umbra-android/app/src/main/python
          gradle -p umbra-android --no-daemon :app:assembleDebug
      - name: Name the APK
        run: cp umbra-android/app/build/outputs/apk/debug/*.apk Umbra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Umbra-apk
          path: Umbra.apk
      - name: Publish release for the in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-$UMBRA_BUILD" Umbra.apk --repo "$GITHUB_REPOSITORY" \
            --title "Umbra Android $UMBRA_BUILD" --notes "Umbra for Android, build $UMBRA_BUILD." --latest=false
